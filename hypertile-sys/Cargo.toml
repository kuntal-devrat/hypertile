[package]
name = "hypertile-sys"
version = "0.1.1"
edition = "2021"
description = "PyO3 bindings and bilingual stepping engine for Hypertile"
license = "MIT OR Apache-2.0"

[lib]
name = "hypertile_sys"
crate-type = ["cdylib", "rlib"]

[dependencies]
hypertile-core = { path = "../hypertile-core" }
pyo3 = { version = "0.23", features = ["extension-module"] }
parking_lot = "0.12"
thiserror = "2.0"
