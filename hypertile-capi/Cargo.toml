[package]
name = "hypertile-capi"
version = "0.1.1"
edition = "2021"
description = "Lightweight extern C ABI for the Hypertile work-stealing runtime"
license = "MIT OR Apache-2.0"

[lib]
name = "hypertile_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hypertile-core = { path = "../hypertile-core" }
parking_lot = "0.12"
crossbeam-utils = "0.8"
